<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AksharGyan Lesson — Interactive learning exercises." />
  <title>AksharGyan — Interactive Lesson</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json">
  <script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }</script>

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       AKSHARGYAN LESSON — ULTRA PREMIUM DESIGN SYSTEM
       ═══════════════════════════════════════════════════════════════════ */

    html,
    body#page-lesson {
      background-color: #f8fafc !important;
      background: #f8fafc !important;
      color: #0f172a !important;
      font-family: 'Plus Jakarta Sans', 'Nunito', sans-serif !important;
      min-height: 100vh;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box;
      transform: none !important;
      animation: none !important;
    }

    body#page-lesson::before,
    body#page-lesson::after {
      display: none !important;
    }

    /* Ambient Studio Glow */
    .ambient-glow-layer {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      z-index: 0 !important;
      overflow: hidden !important;
    }

    .ambient-glow-orb {
      position: absolute !important;
      border-radius: 50% !important;
      pointer-events: none !important;
      will-change: transform;
    }

    .ambient-glow-1 {
      width: 700px !important;
      height: 700px !important;
      top: -12% !important;
      left: -8% !important;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, rgba(99, 102, 241, 0) 70%) !important;
      filter: blur(120px) !important;
      -webkit-filter: blur(120px) !important;
      animation: ambientFloat1 26s ease-in-out infinite alternate !important;
    }

    .ambient-glow-2 {
      width: 650px !important;
      height: 650px !important;
      top: 38% !important;
      right: -10% !important;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.13) 0%, rgba(56, 189, 248, 0) 70%) !important;
      filter: blur(130px) !important;
      -webkit-filter: blur(130px) !important;
      animation: ambientFloat2 30s ease-in-out infinite alternate !important;
    }

    .ambient-glow-3 {
      width: 620px !important;
      height: 620px !important;
      bottom: -15% !important;
      left: 20% !important;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(168, 85, 247, 0) 70%) !important;
      filter: blur(120px) !important;
      -webkit-filter: blur(120px) !important;
      animation: ambientFloat3 28s ease-in-out infinite alternate !important;
    }

    @keyframes ambientFloat1 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(50px, 35px) scale(1.06);
      }
    }

    @keyframes ambientFloat2 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(-45px, -25px) scale(1.04);
      }
    }

    @keyframes ambientFloat3 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(35px, -35px) scale(1.08);
      }
    }

    .bg-orb {
      display: none !important;
    }

    /* Fixed Glass Navbar */
    body#page-lesson .dash-top-navbar,
    .dash-top-navbar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 72px !important;
      z-index: 1000 !important;
      background: rgba(255, 255, 255, 0.98) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      backdrop-filter: blur(16px) !important;
      border-bottom: 1.5px solid #e2e8f0 !important;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05) !important;
      padding: 0 1.75rem !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      box-sizing: border-box !important;
      width: 100% !important;
    }

    .nav-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      color: #0f172a;
      text-decoration: none;
      line-height: 1;
    }

    .nav-logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(99, 102, 241, 0.4);
      flex-shrink: 0;
    }

    .brand-gradient {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Page Layout Shell */
    .lesson-shell {
      min-height: calc(100vh - 72px);
      margin-top: 72px !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2.25rem 1.25rem 3.5rem;
      box-sizing: border-box;
      width: 100%;
      animation: pageFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .lesson-card-wrapper {
      width: 100%;
      max-width: 660px;
      box-sizing: border-box;
      margin: 0 auto;
    }

    /* Progress Header Card */
    .lesson-progress-wrap {
      background: rgba(255, 255, 255, 0.95) !important;
      border: 1.5px solid rgba(226, 232, 240, 0.9) !important;
      border-radius: 24px !important;
      padding: 1.25rem 1.5rem !important;
      margin-bottom: 1.25rem !important;
      box-shadow: 0 10px 25px -6px rgba(15, 23, 42, 0.04) !important;
    }

    .lesson-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .lesson-title-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lesson-meta-chips {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lesson-chip {
      background: #eef2ff;
      color: #4f46e5;
      border: 1px solid #c7d2fe;
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-weight: 800;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .lesson-chip-xp {
      background: #fff7ed;
      color: #ea580c;
      border: 1px solid #ffedd5;
    }

    .lesson-progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
    }

    .lesson-progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #00d4aa);
      border-radius: 9999px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Main Exercise Card */
    .exercise-card-container {
      background: #ffffff !important;
      border: 1.5px solid #e2e8f0 !important;
      border-radius: 32px !important;
      padding: 2.25rem 2rem !important;
      box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.08) !important;
      box-sizing: border-box;
      position: relative;
    }

    /* Passage Box */
    .exercise-passage-card {
      background: linear-gradient(135deg, #f8fafc, #eef2ff) !important;
      border: 2px solid #c7d2fe !important;
      border-radius: 22px !important;
      padding: 1.5rem !important;
      margin-bottom: 1.25rem !important;
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 1rem !important;
    }

    .exercise-passage-text {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 1.4rem !important;
      font-weight: 800 !important;
      color: #0f172a !important;
      line-height: 1.45 !important;
      margin: 0 !important;
    }

    .passage-tts-btn {
      width: 48px !important;
      height: 48px !important;
      border-radius: 16px !important;
      background: #ffffff !important;
      border: 1.5px solid #c7d2fe !important;
      color: #4f46e5 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      flex-shrink: 0 !important;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15) !important;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    .passage-tts-btn:hover {
      transform: scale(1.08) !important;
      border-color: #6366f1 !important;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25) !important;
    }

    .translation-text {
      font-size: 1rem !important;
      font-weight: 700 !important;
      color: #6366f1 !important;
      margin: 0 0 1.25rem !important;
      font-style: italic !important;
    }

    .exercise-question-text {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 1.3rem !important;
      font-weight: 900 !important;
      color: #0f172a !important;
      line-height: 1.4 !important;
      margin: 0 0 1.5rem !important;
    }

    /* MCQ Options Grid */
    .exercise-options-grid {
      display: grid !important;
      grid-template-columns: 1fr !important;
      gap: 0.85rem !important;
    }

    .exercise-option-btn {
      background: #ffffff !important;
      border: 2px solid #e2e8f0 !important;
      border-radius: 20px !important;
      padding: 1.1rem 1.25rem !important;
      display: flex !important;
      align-items: center !important;
      gap: 1rem !important;
      cursor: pointer !important;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      text-align: left !important;
      font-weight: 800 !important;
      font-size: 1.05rem !important;
      color: #1e293b !important;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.02) !important;
    }

    .exercise-option-btn:hover {
      border-color: #6366f1 !important;
      background: #f8fafc !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 25px -6px rgba(99, 102, 241, 0.15) !important;
    }

    .exercise-option-btn.selected {
      border-color: #6366f1 !important;
      background: #eef2ff !important;
      color: #4f46e5 !important;
      box-shadow: 0 12px 28px -6px rgba(99, 102, 241, 0.25) !important;
    }

    .exercise-option-btn.correct {
      border-color: #10b981 !important;
      background: #ecfdf5 !important;
      color: #047857 !important;
      box-shadow: 0 12px 28px -6px rgba(16, 185, 129, 0.25) !important;
    }

    .exercise-option-btn.incorrect {
      border-color: #ef4444 !important;
      background: #fef2f2 !important;
      color: #b91c1c !important;
      box-shadow: 0 12px 28px -6px rgba(239, 68, 68, 0.25) !important;
    }

    .exercise-option-letter {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #475569;
      font-weight: 900;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .exercise-option-btn.selected .exercise-option-letter {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .exercise-option-btn.correct .exercise-option-letter {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .exercise-option-btn.incorrect .exercise-option-letter {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    /* Feedback Banner */
    .exercise-feedback-banner {
      display: flex !important;
      align-items: flex-start !important;
      gap: 0.85rem !important;
      padding: 1.1rem 1.25rem !important;
      border-radius: 20px !important;
      margin-top: 1.5rem !important;
      font-weight: 800 !important;
      font-size: 0.95rem !important;
      line-height: 1.45 !important;
    }

    .exercise-feedback-banner.correct {
      background: #f0fdf4 !important;
      border: 1.5px solid #86efac !important;
      color: #15803d !important;
    }

    .exercise-feedback-banner.incorrect {
      background: #fef2f2 !important;
      border: 1.5px solid #fca5a5 !important;
      color: #b91c1c !important;
    }

    /* Action Buttons */
    .lesson-btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5) !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 16px !important;
      padding: 0.95rem 2.25rem !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 900 !important;
      font-size: 1.05rem !important;
      box-shadow: 0 10px 28px -6px rgba(99, 102, 241, 0.4) !important;
      cursor: pointer !important;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0.6rem !important;
      width: 100% !important;
      margin-top: 1.5rem !important;
    }

    .lesson-btn-primary:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.01) !important;
      box-shadow: 0 16px 36px -8px rgba(99, 102, 241, 0.5) !important;
    }

    .lesson-btn-primary:disabled {
      opacity: 0.55 !important;
      cursor: not-allowed !important;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Lesson Complete Screen */
    .complete-card-container {
      background: #ffffff !important;
      border: 1.5px solid #e2e8f0 !important;
      border-radius: 32px !important;
      padding: 3rem 2.25rem !important;
      box-shadow: 0 24px 50px -12px rgba(15, 23, 42, 0.08) !important;
      text-align: center !important;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body id="page-lesson" class="fade-in-up light-theme">

  <!-- Elegant Ambient Studio Glow -->
  <div class="ambient-glow-layer" aria-hidden="true">
    <div class="ambient-glow-orb ambient-glow-1"></div>
    <div class="ambient-glow-orb ambient-glow-2"></div>
    <div class="ambient-glow-orb ambient-glow-3"></div>
  </div>

  <!-- Top Glass Navigation Bar -->
  <header class="dash-top-navbar">
    <div class="nav-container">
      <a href="dashboard.html" class="nav-logo">
        <div class="nav-logo-icon">📖</div>
        <span>Akshar<span class="brand-gradient">Gyan</span></span>
      </a>

      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <a href="dashboard.html" class="btn-secondary"
          style="background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 9999px; padding: 0.45rem 1.1rem; font-weight: 800; font-size: 0.85rem; color: #475569; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s ease; height: 38px;">
          <i data-lucide="arrow-left" style="width: 15px; height: 15px;"></i>
          <span data-i18n="backToDashboard">Dashboard</span>
        </a>
      </div>
    </div>
  </header>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" data-i18n="loadingText">Generating lesson content...</div>
  </div>

  <main class="lesson-shell">

    <div class="lesson-card-wrapper">

      <!-- 1. Progress Header Card -->
      <div class="lesson-progress-wrap">
        <div class="lesson-progress-header">
          <div class="lesson-title-text">
            <i data-lucide="book-open" style="width: 18px; height: 18px; color: #6366f1;"></i>
            <span id="lesson-title">Lesson</span>
          </div>

          <div class="lesson-meta-chips">
            <span id="lesson-level-badge" class="lesson-chip" style="text-transform: capitalize;">Beginner</span>
            <span id="lesson-type-badge" class="lesson-chip">📖 Reading</span>
            <span class="lesson-chip lesson-chip-xp">
              <i data-lucide="zap" style="width: 14px; height: 14px;"></i>
              <span id="lesson-xp-value">0</span> XP
            </span>
          </div>
        </div>

        <div class="lesson-progress-track">
          <div id="lesson-progress-fill" class="lesson-progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- 2. Main Lesson Content Area -->
      <div id="lesson-content">

        <!-- Exercise Card Container -->
        <div id="exercise-card" class="exercise-card-container">

          <!-- Exercise Instruction -->
          <div
            style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem;">
            <p id="exercise-instruction-text"
              style="font-weight: 800; font-size: 1.05rem; color: #6366f1; margin: 0; display: flex; align-items: center; gap: 0.4rem;">
              <i data-lucide="help-circle" style="width: 18px; height: 18px;"></i>
              <span>Loading exercise...</span>
            </p>
            <button id="exercise-tts-btn" title="Listen to text"
              style="width: 44px; height: 44px; border-radius: 14px; background: #eef2ff; border: 1.5px solid #c7d2fe; color: #6366f1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: all 0.2s ease;">
              <i data-lucide="volume-2" style="width: 22px; height: 22px;"></i>
            </button>
          </div>

          <!-- Dynamic Exercise Body -->
          <div id="exercise-body">
            <!-- Injected by lesson.js -->
          </div>

          <!-- Feedback Banner -->
          <div id="exercise-feedback" class="exercise-feedback-banner hidden">
            <div id="feedback-icon" style="font-size: 1.25rem; flex-shrink: 0;">✅</div>
            <p id="feedback-text" style="margin: 0;">Correct!</p>
          </div>

          <!-- Action Buttons -->
          <div class="lesson-actions">
            <button id="check-btn" class="lesson-btn-primary" disabled>
              <span data-i18n="lessonCheck">Check Answer</span>
              <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
            </button>
            <button id="continue-lesson-btn" class="lesson-btn-primary hidden">
              <span data-i18n="lessonContinue">Continue</span>
              <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
            </button>
          </div>

        </div>

      </div>

      <!-- 3. Lesson Complete Celebration Screen -->
      <div id="lesson-complete" class="complete-card-container hidden">
        <div
          style="width: 68px; height: 68px; border-radius: 24px; background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; box-shadow: 0 14px 32px -6px rgba(16, 185, 129, 0.4);">
          🎉
        </div>

        <h2
          style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2rem; font-weight: 900; color: #0f172a; margin: 0 0 0.5rem;"
          data-i18n="lessonComplete">
          Lesson Complete!
        </h2>
        <p style="color: #64748b; font-weight: 600; font-size: 1rem; margin: 0 0 1.75rem;">
          Awesome effort! You've successfully completed this exercise module.
        </p>

        <div style="display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2rem;">
          <div
            style="background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 20px; padding: 1.1rem 1.5rem; text-align: center; min-width: 120px;">
            <div id="complete-score"
              style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 2.2rem; color: #16a34a; line-height: 1;">
              0%</div>
            <div
              style="font-weight: 800; font-size: 0.8rem; color: #15803d; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.35rem;"
              data-i18n="lessonAccuracy">Accuracy</div>
          </div>
          <div
            style="background: #eef2ff; border: 1.5px solid #c7d2fe; border-radius: 20px; padding: 1.1rem 1.5rem; text-align: center; min-width: 120px;">
            <div id="complete-xp"
              style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 2.2rem; color: #4f46e5; line-height: 1;">
              +0</div>
            <div
              style="font-weight: 800; font-size: 0.8rem; color: #3730a3; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.35rem;">
              XP Earned</div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <button id="next-lesson-btn" class="lesson-btn-primary" style="margin-top: 0;">
            <span data-i18n="lessonNext">Next Lesson</span>
            <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
          </button>

<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create your AksharGyan account — AI-powered literacy platform for learners."
    />
    <title>AksharGyan — Register</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="/manifest.json">
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}</script>
  </head>
  <body id="page-register" class="fade-in-up light-theme">
    <div class="split-layout">
      <!-- Left Side: Form -->
      <div class="split-left">
        <div class="card">
          <div class="logo-area">
            <h1 class="logo-title" data-i18n="registerTitle">
              Create Your Account
            </h1>
            <p class="logo-subtitle">
              <span class="brand-gradient">AksharGyan</span>
            </p>
          </div>

          <form id="register-form" novalidate>
            <div class="form-grid-2col">
              <!-- Left column -->
              <div>
                <div class="form-group">
                  <label for="fullName" data-i18n="fullNameLabel"
                    >Full Name</label
                  >
                  <div class="input-wrapper">
                    <svg
                      class="input-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                      />
                    </svg>
                    <input
                      type="text"
                      id="fullName"
                      name="fullName"
                      required
                      data-i18n-placeholder="fullNamePlaceholder"
                      placeholder="Enter your full name"
                    />
                  </div>
                  <span class="error-text" id="fullName-error"></span>
                </div>

                <div class="form-group">
                  <label for="email" data-i18n="emailLabel">Email</label>
                  <div class="input-wrapper">
                    <svg
                      class="input-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                      />
                    </svg>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      required
                      data-i18n-placeholder="emailPlaceholder"
                      placeholder="Enter your email address"
                    />
                  </div>
                  <span class="error-text" id="email-error"></span>
                </div>

                <div class="form-group">
                  <label for="password" data-i18n="passwordLabel"
                    >Password</label
                  >
                  <div class="input-wrapper">
                    <svg
                      class="input-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                      />
                    </svg>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      required
                      minlength="6"
                      data-i18n-placeholder="passwordPlaceholder"
                      placeholder="Create a password (min 6 characters)"
                    />
                    <button
                      type="button"
                      class="password-toggle"
                      tabindex="-1"
                      aria-label="Toggle password visibility"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                        />
                      </svg>
                    </button>
                  </div>
                  <span class="error-text" id="password-error"></span>
                </div>

                <div class="form-group">
                  <label for="confirmPassword" data-i18n="confirmPasswordLabel"
                    >Confirm Password</label
                  >
                  <div class="input-wrapper">
                    <svg
                      class="input-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                      />
                    </svg>
                    <input
                      type="password"
                      id="confirmPassword"
                      name="confirmPassword"
                      required
                      data-i18n-placeholder="confirmPasswordPlaceholder"
                      placeholder="Re-enter your password"
                    />
                    <button
                      type="button"
                      class="password-toggle"
                      tabindex="-1"
                      aria-label="Toggle password visibility"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                        />
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                        />
                      </svg>
                    </button>
                  </div>
                  <span class="error-text" id="confirmPassword-error"></span>
                </div>
                <div class="form-group">
                  <label for="ageGroup">
                    <span data-i18n="ageGroupLabel">Age Group</span>
                  </label>
                  <select id="ageGroup" name="ageGroup" required>
                    <option value="" data-i18n-option="ageSelectPlaceholder">
                      — Select your age group —
                    </option>
                    <option value="below18" data-i18n-option="ageBelow18">
                      Below 18
                    </option>
                    <option value="18-25" data-i18n-option="age18to25">
                      18–25
                    </option>
                    <option value="26-40" data-i18n-option="age26to40">
                      26–40
                    </option>
                    <option value="41-60" data-i18n-option="age41to60">
                      41–60
                    </option>
                    <option value="60+" data-i18n-option="ageAbove60">
                      Above 60
                    </option>
                  </select>
                  <span class="error-text" id="ageGroup-error"></span>
                </div>
              </div>

              <!-- Right column -->
              <div>
                <div class="form-group">
                  <label for="preferredLang" data-i18n="preferredLangLabel"
                    >Preferred Language</label
                  >
                  <select id="preferredLang" name="preferredLang">
                    <option value="en" data-i18n-option="langEnglish">
                      English
                    </option>
                    <option value="hi" data-i18n-option="langHindi">
                      Hindi (हिन्दी)
                    </option>
                    <option value="ta" data-i18n-option="langTamil">
                      Tamil (தமிழ்)
                    </option>
                    <option value="te" data-i18n-option="langTelugu">
                      Telugu (తెలుగు)
                    </option>
                    <option value="kn" data-i18n-option="langKannada">
                      Kannada (ಕನ್ನಡ)
                    </option>
                    <option value="bn" data-i18n-option="langBengali">
                      Bengali (বাংলা)
                    </option>
                    <option value="mr" data-i18n-option="langMarathi">
                      Marathi (मराठी)
                    </option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Which language would you like to learn?</label>
                  <select
                    id="target-language"
                    class="input-field"
                    required
                  ></select>
                </div>

                <div class="form-group">
                  <label for="motherTongue">
                    <span data-i18n="motherTongueLabel">Mother Tongue</span>
                  </label>
                  <div class="input-wrapper">
                    <svg
                      class="input-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"
                      />
                    </svg>
                    <input
                      type="text"
                      id="motherTongue"
                      name="motherTongue"
                      required
                      data-i18n-placeholder="motherTonguePlaceholder"
                      placeholder="e.g., Hindi, Tamil, etc."
                    />
                  </div>
                  <span class="error-text" id="motherTongue-error"></span>
                </div>

                <div class="form-group">
                  <label for="literacyLevel">
                    <span data-i18n="literacyLevelLabel">Literacy Level</span>
                  </label>
                  <select id="literacyLevel" name="literacyLevel" required>
                    <option value="" data-i18n-option="litSelectPlaceholder">
                      — Select your literacy level —
                    </option>
                    <option
                      value="neverLearned"
                      data-i18n-option="litNeverLearned"
                      data-i18n-option="litNeverLearned"
                    >
                      Never learned to read/write
                    </option>
                    <option
                      value="canRecognize"
                      data-i18n-option="litCanRecognize"
                      data-i18n-option="litCanRecognize"
                    >
                      Can recognize some letters/words but not read sentences
                    </option>
                    <option
                      value="canReadSimple"
                      data-i18n-option="litCanReadSimple"
                      data-i18n-option="litCanReadSimple"
                    >
                      Can read/write simple sentences with difficulty
                    </option>
                    <option
                      value="canReadComfort"
                      data-i18n-option="litCanReadComfort"
                      data-i18n-option="litCanReadComfort"
                    >
                      Can read/write comfortably, returning to learn more
                    </option>
                    <option value="preferNot" data-i18n-option="litPreferNot" data-i18n-option="litPreferNot">
                      Prefer not to say
                    </option>
                  </select>
                  <span class="error-text" id="literacyLevel-error"></span>
                </div>

              </div>
            </div>

            <button
              type="submit"
              class="btn-primary"
              id="register-btn"
              data-i18n="registerBtn"
            >
              Register
            </button>

            <div id="status-message" class="status-message"></div>
          </form>

          <div class="nav-link-area">
            <a href="login.html" data-i18n="goToLogin"
              >Already have an account? Login</a
            >
          </div>
        </div>
      </div>

      <!-- Right Side: Brand Panel -->
      <div class="split-right">
        <div class="auth-brand-panel">
          <div class="auth-brand-blob blob-1"></div>
          <div class="auth-brand-blob blob-2"></div>
          <div class="auth-brand-content">
            <div class="auth-brand-logo">📖 AksharGyan</div>
            <h2>Start your reading journey today</h2>
            <p>
              A few quick details help us tailor lessons to your pace, your
              language, and your goals — right from lesson one.
            </p>
          </div>
          <div class="auth-illustration-frame">
            <img
              src="assets/register_illustration.png"
              alt="Registration Illustration"
              class="split-illustration"
            />
          </div>
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <script src="auth.js"></script>
    <script src="tts.js"></script>
    <script src="main.js"></script>
  </body>
</html>
